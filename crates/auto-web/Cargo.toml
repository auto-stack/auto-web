[package]
name = "auto-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# PLAN-906: 轻合同单源迁语言仓（Web 消费语言仓 crate，方向=既有 web→lang path 依赖）
auto-web-contract = { path = "../../../auto-lang/crates/auto-web-contract", version = "=0.1.0" }
auto-lang-core = { path = "../../../auto-lang/crates/auto-lang-core" }
auto-generation-core = { path = "../../../auto-lang/crates/auto-generation-core", version = "=0.1.0" }

a2r-std = { path = "../../../auto-lang/crates/a2r-std" }
auto-val = { path = "../../../auto-lang/crates/auto-val", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
socket2 = "0.5"
serde_json = "1"
futures = "0.3"
lazy_static = "1.4"
base64 = "0.22"
sha1 = "0.10"


auto-media-core = { path="../../../auto-lang/crates/auto-media-core", default-features=false, features=["image-codec"] }

mime_guess = "2"

serde = {version="1",features=["derive"]}
toml="0.8"
regex="1"
semver="1"
sha2="0.10"

[features]
# PLAN-901：语言仓 test-http-e2e feature 拍平退役——Core HTTP helper 转
# 常驻可见；本 Web 域 feature 名保留（auto-api-gen/auto-man/CI 入口仍以
# 此名选择 Web e2e 串行档），仅去掉已不存在的语言侧转发。
test-http-e2e = []

[dev-dependencies]
# PLAN-901：helper 常驻后 dev 测试无需再请求语言 feature。
auto-lang-core = { path="../../../auto-lang/crates/auto-lang-core" }
tempfile="3"
blake3="1.5"
